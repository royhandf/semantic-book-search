<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description"
          content="Effortlessly discover books by searching titles, authors, or keywords with our semantic engine. Browse a diverse selection and start reading online instantly.">
    <meta name="keywords"
          content="books, search, titles, authors, keywords, semantic engine, reading, online">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SemanticBook - Find Your Books</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/output.css') }}" />
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/fonts.css') }}" />
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/notyf.min.css') }}" />
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <nav class="bg-red py-4 px-6 shadow-sm">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <!-- Logo and Nav Links -->
        <div class="flex items-center space-x-8">
          <div class="flex items-center space-x-2">
            <img class="w-8 h-8"
                 src="{{ url_for('static', filename='images/book.png') }}"
                 alt="flowbite logo"
                 width="32"
                 height="32" />
            <span class="text-xl font-semibold">SemanticBook</span>
          </div>
        </div>
        <!-- Auth Section -->
        <div class="flex items-center space-x-4">
          <button id="dropdownAvatarNameButton"
                  data-dropdown-toggle="dropdownAvatarName"
                  class="flex items-center text-sm pe-1 font-medium text-gray-900 rounded-full hover:text-blue-600 md:me-0 focus:ring-gray-100"
                  type="button">
            <span class="sr-only">Open user menu</span>
            <img class="w-8 h-8 me-2 rounded-full"
                 src="https://api.dicebear.com/7.x/adventurer-neutral/svg?seed=mail@ashallendesign.co.uk"
                 alt="avatar"
                 height="32"
                 width="32" />
            Admin
            <svg class="w-2.5 h-2.5 ms-3"
                 aria-hidden="true"
                 xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 10 6">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4" />
            </svg>
          </button>
          <!-- Dropdown menu -->
          <div id="dropdownAvatarName"
               class="z-10 hidden bg-white divide-y divide-gray-100 rounded-lg shadow w-44 dark:bg-gray-700 dark:divide-gray-600">
            <div class="px-4 py-3 text-sm text-gray-900 dark:text-white">
              <div class="font-medium ">Pro User</div>
              <div class="truncate">name@flowbite.com</div>
            </div>
            <ul class="py-2 text-sm text-gray-700 dark:text-gray-200"
                aria-labelledby="dropdownInformdropdownAvatarNameButtonationButton">
              <li>
                <a href="#"
                   class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Dashboard</a>
              </li>
              <li>
                <a href="#"
                   class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Settings</a>
              </li>
              <li>
                <a href="#"
                   class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Earnings</a>
              </li>
            </ul>
            <div class="py-2">
              <a href="#"
                 class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 dark:text-gray-200 dark:hover:text-white">Sign out</a>
            </div>
          </div>
          <button data-modal-target="signin"
                  data-modal-toggle="signin"
                  class="bg-violet-600 text-white px-6 py-2 rounded-lg hover:bg-violet-700 transition duration-300">
            Sign In
          </button>
          <!-- Main modal -->
          <div id="signin"
               tabindex="-1"
               aria-hidden="true"
               class="fixed top-0 left-0 right-0 z-50 hidden w-full p-4 overflow-x-hidden overflow-y-auto md:inset-0 h-[calc(100%-1rem)] max-h-full">
            <div class="relative p-4 w-full max-w-md max-h-full">
              <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
                <!-- Modal header -->
                <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                  <h3 class="text-lg font-semibold text-gray-900">Sign In to Your Account</h3>
                  <button type="button"
                          class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center"
                          data-modal-toggle="signin">
                    <svg class="w-3 h-3"
                         aria-hidden="true"
                         xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 14 14">
                      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                    </svg>
                    <span class="sr-only">Close modal</span>
                  </button>
                </div>
                <!-- Modal body -->
                <div class="p-4 md:p-5">
                  <form class="space-y-4" method="post" action="{{ url_for("main.signin") }}">
                    <div>
                      <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email</label>
                      <input type="email"
                             name="email"
                             id="email"
                             class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                             placeholder="name@company.com"
                             required />
                    </div>
                    <div>
                      <label for="password" class="block mb-2 text-sm font-medium text-gray-900">Password</label>
                      <input type="password"
                             name="password"
                             id="password"
                             placeholder="••••••••"
                             class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                             required />
                    </div>
                    <button type="submit"
                            class="w-full text-white bg-violet-700 hover:bg-violet-800 focus:ring-4 focus:outline-none focus:ring-violet-300 font-medium rounded-lg text-sm px-5 py-2.5 mt-4 text-center">
                      Sign in
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <!-- Hero Section -->
    <section class="max-w-7xl mx-auto px-6 h-[80vh] flex flex-col justify-center items-center">
      <div class="text-center">
        <h1 class="text-4xl sm:text-5xl md:text-5xl lg:text-5xl xl:text-6xl mb-3 text-center text-gray-800 font-black leading-10">
          Semantic
          <span class="text-violet-800">Book Search</span>
        </h1>
        <p class="text-xl text-gray-600 mb-6 max-w-3xl mx-auto">
          Effortlessly discover books by searching titles, authors, or keywords with our semantic engine. Browse a diverse selection and start reading online instantly.
        </p>
        <!-- Search Bar -->
        <div class="max-w-2xl mx-auto relative">
          <form action="{{ url_for("main.search") }}" method="get">
            <input type="text"
                   name="query"
                   class="w-full px-6 py-4 rounded-full shadow-sm border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent"
                   placeholder="Search for books..." />
            <button type="submit"
                    class="absolute right-2 top-2 bg-violet-700 text-white px-8 py-2 rounded-full hover:bg-violet-800 transition duration-300">
              Search
            </button>
          </form>
        </div>
      </div>
    </section>
    <script src="{{ url_for('static', filename='js/flowbite.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/notyf.min.js') }}"></script>
    <script type="module">
      var notyf = new Notyf({
          duration: 3000,
          position: {
              x: 'right',
              y: 'top',
          },
      });
  
      const messages = {{ get_flashed_messages(with_categories=true) | tojson }};
      if (Array.isArray(messages) && messages.length > 0) {
          messages.forEach(([category, message]) => {
              if (category === 'success') {
                  notyf.success(message);
              } else if (category === 'error') {
                  notyf.error(message);
              }
          });
      }
    </script>
  </body>
</html>
